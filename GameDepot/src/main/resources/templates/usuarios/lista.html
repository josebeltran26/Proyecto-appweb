<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Usuarios y Clientes')}"></head>
<body>

<div class="admin-layout">
  <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>

  <main class="admin-main">
    <header th:replace="~{fragments/header :: header('Directorio de Usuarios')}"></header>

    <div class="admin-body">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <div class="table-card">
        <div class="table-header">
          <div>
            <h2 style="font-size: 16px; font-weight: 700; color: var(--text-1);">Cuentas Registradas</h2>
            <p style="font-size: 12px; color: var(--text-3);" th:text="${#lists.size(usuarios)} + ' usuarios en la plataforma'"></p>
          </div>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 60px;">ID</th>
                <th>Nombre</th>
                <th>Correo Electrónico</th>
                <th>Teléfono</th>
                <th>Direcciones</th>
                <th>Rol</th>
                <th>Fecha de Registro</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="7" class="text-center text-muted" style="padding: 24px;">No hay usuarios registrados.</td>
              </tr>
              <tr th:each="u : ${usuarios}">
                <td class="text-muted" th:text="'#' + ${u.id}">#1</td>
                <td>
                  <div class="fw-700" style="color: var(--text-1);" th:text="${u.nombre}">Nombre</div>
                </td>
                <td>
                  <span style="color: var(--accent);" th:text="${u.email}">email@example.com</span>
                </td>
                <td>
                  <span style="color: var(--text-2);" th:text="${u.telefono ?: 'No especificado'}">6621234567</span>
                </td>
                <td>
                  <span class="pill pill-neutral" style="font-size: 11px;" th:text="${#lists.size(u.direcciones)} + ' registradas'">0 registradas</span>
                </td>
                <td>
                  <span th:if="${u.rol.name() == 'ADMIN'}" class="pill pill-purple">ADMINISTRADOR</span>
                  <span th:if="${u.rol.name() == 'CLIENTE'}" class="pill pill-neutral">CLIENTE</span>
                </td>
                <td th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
