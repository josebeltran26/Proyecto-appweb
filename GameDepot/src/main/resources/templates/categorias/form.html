<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Editar Categoría')}"></head>
<body>

<div class="admin-layout">
  <aside th:replace="~{fragments/sidebar :: sidebar('categorias')}"></aside>

  <main class="admin-main">
    <header th:replace="~{fragments/header :: header('Editar Categoría #' + ${categoria.id})}"></header>

    <div class="admin-body" style="max-width: 600px;">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <div class="table-card" style="padding: 28px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div>
            <h2 style="font-size: 18px; font-weight: 700; color: var(--text-1);">Modificar Categoría</h2>
            <p style="font-size: 12px; color: var(--text-3);">Actualiza la información de esta categoría</p>
          </div>
          <a th:href="@{/admin/categorias}" class="btn btn-secondary btn-sm">← Volver al listado</a>
        </div>

        <form th:action="@{/admin/categorias}" th:object="${categoria}" method="post">
          <input type="hidden" th:field="*{id}">

          <div class="form-group">
            <label class="form-label" for="nombre">Nombre de la Categoría *</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-input" required maxlength="80">
          </div>

          <div class="form-group">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}" class="form-textarea" rows="4"></textarea>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary btn-block">Guardar Cambios</button>
            <a th:href="@{/admin/categorias}" class="btn btn-secondary" style="white-space: nowrap;">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

</body>
</html>
