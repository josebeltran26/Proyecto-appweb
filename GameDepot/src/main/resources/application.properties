spring.application.name=gamedepot-admin
server.port=8080

# -------------------------------------------------------------
# Base de Datos MySQL (Credenciales solicitadas por el evaluador)
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/gamedepot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# -------------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
